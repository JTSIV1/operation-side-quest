<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Side-Quest - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1D2526;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2A3537;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .branding-login {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
        }
        .branding-login img {
            height: 70px;
            width: auto;
        }
        p.subtitle {
            margin-top: 0;
            margin-bottom: 2rem;
            color: #a0a0a0;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 2px solid #666;
            background-color: #3A4547;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: rgba(76, 175, 80, 0.1);
            color: #e0e0e0;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: rgba(76, 175, 80, 0.25);
        }
        .toggle {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            cursor: pointer;
            font-weight: 500;
        }
        .toggle span {
            padding-bottom: 5px;
            border-bottom: 2px solid transparent;
            color: #777;
            transition: all 0.3s;
        }
        .toggle span.active {
            border-bottom: 2px solid #4CAF50;
            color: #fff;
        }
        .hidden { display: none; }
        .error { color: #cf6679; font-size: 0.9rem; margin-top: 15px; min-height: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="branding-login">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="margin-right: 10px;">
            <img src="{{ url_for('static', filename='images/text.png') }}" alt="Operation Side-Quest">
        </div>
        <p class="subtitle">Adventure awaits.</p>
        
        <div class="toggle">
            <span id="tab-login" class="active" onclick="showLogin()">Sign In</span>
            <span id="tab-signup" onclick="showSignup()">Sign Up</span>
        </div>

        <div id="login-form">
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button onclick="doLogin()">Log In</button>
        </div>

        <div id="signup-form" class="hidden">
            <input type="text" id="signup-username" placeholder="Username" required>
            <input type="email" id="signup-email" placeholder="Email" required>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="signup-firstname" placeholder="First Name" required>
                <input type="text" id="signup-lastname" placeholder="Last Name" required>
            </div>
            <input type="password" id="signup-password" placeholder="Password" required>
            <button onclick="doSignup()">Sign Up</button>
        </div>
        <div id="message" class="error"></div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        function showLogin() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('signup-form').classList.add('hidden');
            document.getElementById('tab-login').classList.add('active');
            document.getElementById('tab-signup').classList.remove('active');
            document.getElementById('message').innerText = "";
        }

        function showSignup() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('signup-form').classList.remove('hidden');
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-signup').classList.add('active');
            document.getElementById('message').innerText = "";
        }

        async function doLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            if(!email || !password) {
                document.getElementById('message').innerText = "Please fill in all fields.";
                return;
            }

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('user_id', data.user_id);
                    window.location.href = "/";
                } else {
                    document.getElementById('message').innerText = data.detail || "Login failed";
                }
            } catch (e) {
                console.error(e);
                document.getElementById('message').innerText = "Connection error. Is backend running?";
            }
        }

        async function doSignup() {
            const username = document.getElementById('signup-username').value;
            const email = document.getElementById('signup-email').value;
            const firstName = document.getElementById('signup-firstname').value;
            const lastName = document.getElementById('signup-lastname').value;
            const password = document.getElementById('signup-password').value;

            if(!username || !email || !firstName || !lastName || !password) {
                document.getElementById('message').innerText = "Please fill in all fields.";
                return;
            }

            try {
                const res = await fetch(`${API_URL}/signup`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username, email, first_name: firstName, last_name: lastName, password
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('user_id', data.user_id);
                    window.location.href = "/";
                } else {
                    document.getElementById('message').innerText = data.detail || "Signup failed";
                }
            } catch (e) {
                console.error(e);
                document.getElementById('message').innerText = "Connection error. Is backend running?";
            }
        }
        
        // Redirect to home if already logged in
        if (localStorage.getItem('user_id')) {
            window.location.href = "/";
        }
    </script>
</body>
</html>
