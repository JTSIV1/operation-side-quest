<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Side-Quest</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     
    <!-- Leaflet Control Geocoder CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: sans-serif;
            background-color: #2A3537;
            color: #e0e0e0;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        .sidebar {
            width: 33.33%;
            background-color: #2A3537;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #444;
            color: #ffffff;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .map-wrapper {
            width: 66.67%;
            height: 100%;
            position: relative;
        }
        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }
        .branding {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        .branding img {
            height: 100px;
            width: auto;
        }
        /* Invert map tiles to create a "Streets Night Mode" from standard OSM */
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn {
            flex: 1;
            padding: 25px;
            border: 2px solid;
            border-radius: 8px;
            color: #e0e0e0;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }
        .btn:hover { color: #ffffff; }
        
        .btn-city { border-color: #009688; background-color: rgba(0, 150, 136, 0.1); }
        .btn-city:hover { background-color: rgba(0, 150, 136, 0.25); }
        
        .btn-neighborhood { border-color: #673AB7; background-color: rgba(103, 58, 183, 0.1); }
        .btn-neighborhood:hover { background-color: rgba(103, 58, 183, 0.25); }
        
        .btn-nightlife { border-color: #FF5722; background-color: rgba(255, 87, 34, 0.1); }
        .btn-nightlife:hover { background-color: rgba(255, 87, 34, 0.25); }
        
        .btn-gems { border-color: #E91E63; background-color: rgba(233, 30, 99, 0.1); }
        .btn-gems:hover { background-color: rgba(233, 30, 99, 0.25); }
        
        .btn-path { border-color: #4CAF50; background-color: rgba(76, 175, 80, 0.1); width: 100%; }
        .btn-path:hover { background-color: rgba(76, 175, 80, 0.25); }

        /* Chart Path View Styles */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #444;
        }
        .toggle-label {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .square-toggle {
            appearance: none;
            -webkit-appearance: none;
            width: 35px;
            height: 35px;
            background-color: #3A4547;
            border: 2px solid #666;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }
        .square-toggle:checked {
            background-color: #4CAF50;
            border-color: #4CAF50;
        }
        .square-toggle:checked::after {
            content: '';
            position: absolute;
            left: 11px;
            top: 5px;
            width: 8px;
            height: 16px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }
        /* Transport Switch */
        .transport-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .date-input {
            background-color: #3A4547;
            border: 2px solid #666;
            border-radius: 4px;
            color: #e0e0e0;
            padding: 5px;
            font-family: inherit;
            color-scheme: dark;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #3A4547;
            border: 2px solid #666;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #4CAF50;
            border-color: #4CAF50;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        /* Range Slider */
        .range-slider {
            -webkit-appearance: none;
            width: 150px;
            height: 8px;
            background: #3A4547;
            border: 1px solid #666;
            outline: none;
            border-radius: 4px;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: #4CAF50;
            cursor: pointer;
            border-radius: 4px;
        }
        .range-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: #4CAF50;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        .btn-submit {
            width: 100%;
            margin-top: 20px;
            border-color: #4CAF50;
            background-color: rgba(76, 175, 80, 0.1);
        }
        .btn-submit:hover {
            background-color: rgba(76, 175, 80, 0.25);
        }
        /* Collapsible Styles */
        .collapsible-header {
            cursor: pointer;
        }
        .collapsible-content {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 0 15px;
            border-bottom: 1px solid #444;
        }
        .arrow-icon {
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="branding">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="margin-right: 10px;">
            <img src="{{ url_for('static', filename='images/text.png') }}" alt="Operation Side-Quest">
        </div>
        <div id="widgets">
            <div class="button-row">
                <button class="btn btn-city">New City</button>
                <button class="btn btn-neighborhood">New Neighborhood</button>
            </div>
            <div class="button-row">
                <button class="btn btn-nightlife">Nightlife</button>
                <button class="btn btn-gems">Hidden Gems</button>
            </div>
            <div class="button-row">
                <button class="btn btn-path">Chart Your Own Path</button>
            </div>
        </div>
        <div id="chart-path-view" style="display: none;">
            <div style="display: flex; align-items: center; margin-bottom: 20px;">
                <button id="btn-back" aria-label="Back to main menu" title="Back to main menu" style="background: none; border: none; color: #e0e0e0; font-size: 1.5rem; cursor: pointer; padding: 0; margin-right: 15px;">&larr;</button>
                <h2 id="view-title" style="margin: 0;">Customize</h2>
            </div>
            <p id="view-description" style="display: none; margin-bottom: 15px; color: #ccc;">
                Generate a curated tour of the city's highlights.
            </p>
            <div class="toggle-row">
                <span class="toggle-label">When to begin:</span>
                <input type="datetime-local" class="date-input" id="datetime-input">
            </div>
            <div class="toggle-row transport-row">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="toggle-label">Budget</span>
                    <select id="budget-select" class="date-input">
                        <option value="1">$</option>
                        <option value="2">$$</option>
                        <option value="3">$$$</option>
                        <option value="4">$$$$</option>
                    </select>
                </div>
                <div class="transport-group">
                    <span class="toggle-label">Walking</span>
                    <label class="switch">
                        <input type="checkbox" id="transport-mode-toggle">
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-label">Driving</span>
                </div>
            </div>
            <div class="toggle-row">
                <span class="toggle-label">Route Length</span>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="range" min="0" max="300" value="60" step="5" class="range-slider" id="duration-slider">
                    <span id="duration-display" style="width: 90px; text-align: right;">1 hr 0 min</span>
                </div>
            </div>
            <div class="toggle-row collapsible-header" id="advanced-options-header" style="display: none;" role="button" tabindex="0" aria-expanded="false" aria-controls="advanced-options-wrapper">
                <span class="toggle-label">Advanced Options</span>
                <span class="arrow-icon">&#9660;</span>
            </div>
            <div id="advanced-options-wrapper">
            <div class="toggle-row">
                <span class="toggle-label">Historical Sites</span>
                <input type="checkbox" class="square-toggle" data-category="historical">
            </div>
            <div class="toggle-row">
                <span class="toggle-label">Nature & Parks</span>
                <input type="checkbox" class="square-toggle" data-category="nature/park">
            </div>
            <div class="toggle-row collapsible-header" id="food-dining-header" role="button" tabindex="0" aria-expanded="false" aria-controls="food-dining-content">
                <span class="toggle-label">Food & Dining</span>
                <span class="arrow-icon">&#9660;</span>
            </div>
            <div class="collapsible-content" id="food-dining-content" style="display: none;">
                <div class="toggle-row">
                    <span class="toggle-label">Restaurants</span>
                    <input type="checkbox" class="square-toggle" data-category="restaurants">
                </div>
                <div class="toggle-row">
                    <span class="toggle-label">Cafes</span>
                    <input type="checkbox" class="square-toggle" data-category="cafes">
                </div>
                <div class="toggle-row" style="border-bottom: none;">
                    <span class="toggle-label">Desserts</span>
                    <input type="checkbox" class="square-toggle" data-category="desserts">
                </div>
            </div>
            <div class="toggle-row">
                <span class="toggle-label">Shopping</span>
                <input type="checkbox" class="square-toggle" data-category="shopping">
            </div>
            <div class="toggle-row">
                <span class="toggle-label">Art</span>
                <input type="checkbox" class="square-toggle" data-category="art">
            </div>
            <div class="toggle-row">
                <span class="toggle-label">Museums</span>
                <input type="checkbox" class="square-toggle" data-category="museums">
            </div>
            <div class="toggle-row">
                <span class="toggle-label">Nightlife</span>
                <input type="checkbox" class="square-toggle" data-category="nightlife">
            </div>
            <div class="toggle-row" style="justify-content: center; gap: 15px;">
                <span style="font-size: 0.9rem;">More Diverse</span>
                <input type="range" min="1" max="5" value="3" step="1" class="range-slider" id="popularity-slider">
                <span style="font-size: 0.9rem;">Only Best Rated</span>
            </div>
            </div>
            <button class="btn btn-submit" id="btn-generate">Generate Route</button>
        </div>
    </div>
    <div class="map-wrapper">
        <div id="map"></div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

<!-- Leaflet Control Geocoder JS -->
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>
    // Initialize map centered on a default location (e.g., Pittsburgh)
    var map = L.map('map').setView([40.4432, -79.9428], 13);

    // Add OpenStreetMap tile layer (inverted via CSS for night mode)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Add Search Bar (Geocoder)
    L.Control.geocoder().addTo(map);

    // Set default datetime to current time
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('datetime-input').value = now.toISOString().slice(0, 16);

    // Handle New City Button
    document.querySelector('.btn-city').addEventListener('click', function() {
        document.getElementById('widgets').style.display = 'none';
        document.getElementById('chart-path-view').style.display = 'block';
        
        // UI Updates for New City
        document.getElementById('view-title').textContent = 'New City';
        document.getElementById('view-description').style.display = 'block';
        document.getElementById('advanced-options-header').style.display = 'flex';
        document.getElementById('advanced-options-wrapper').style.display = 'none';
        document.querySelector('#advanced-options-header .arrow-icon').style.transform = 'rotate(0deg)';
        document.getElementById('advanced-options-header').setAttribute('aria-expanded', 'false');

        // Set Defaults for New City
        document.querySelectorAll('.square-toggle').forEach(cb => cb.checked = false);
        ['historical', 'art', 'museums'].forEach(cat => {
            const cb = document.querySelector(`.square-toggle[data-category="${cat}"]`);
            if (cb) cb.checked = true;
        });
        document.getElementById('popularity-slider').value = 5;
        document.getElementById('budget-select').value = 3;
        document.getElementById('duration-slider').value = 180;
        updateDuration();
    });

    // Handle New Neighborhood Button
    document.querySelector('.btn-neighborhood').addEventListener('click', function() {
        document.getElementById('widgets').style.display = 'none';
        document.getElementById('chart-path-view').style.display = 'block';
        
        // UI Updates for New Neighborhood
        document.getElementById('view-title').textContent = 'New Neighborhood';
        document.getElementById('view-description').style.display = 'block';
        document.getElementById('advanced-options-header').style.display = 'flex';
        document.getElementById('advanced-options-wrapper').style.display = 'none';
        document.querySelector('#advanced-options-header .arrow-icon').style.transform = 'rotate(0deg)';
        document.getElementById('advanced-options-header').setAttribute('aria-expanded', 'false');

        // Set Defaults for New Neighborhood
        document.querySelectorAll('.square-toggle').forEach(cb => cb.checked = false);
        ['historical', 'nature/park', 'shopping', 'cafes'].forEach(cat => {
            const cb = document.querySelector(`.square-toggle[data-category="${cat}"]`);
            if (cb) cb.checked = true;
        });
        document.getElementById('popularity-slider').value = 3;
        document.getElementById('budget-select').value = 1;
        document.getElementById('duration-slider').value = 120;
        updateDuration();
    });

    // Handle Nightlife Button
    document.querySelector('.btn-nightlife').addEventListener('click', function() {
        document.getElementById('widgets').style.display = 'none';
        document.getElementById('chart-path-view').style.display = 'block';
        
        // UI Updates for Nightlife
        document.getElementById('view-title').textContent = 'Nightlife';
        document.getElementById('view-description').style.display = 'block';
        document.getElementById('advanced-options-header').style.display = 'flex';
        document.getElementById('advanced-options-wrapper').style.display = 'none';
        document.querySelector('#advanced-options-header .arrow-icon').style.transform = 'rotate(0deg)';
        document.getElementById('advanced-options-header').setAttribute('aria-expanded', 'false');

        // Set Defaults for Nightlife
        document.querySelectorAll('.square-toggle').forEach(cb => cb.checked = false);
        ['nightlife', 'desserts'].forEach(cat => {
            const cb = document.querySelector(`.square-toggle[data-category="${cat}"]`);
            if (cb) cb.checked = true;
        });
        document.getElementById('popularity-slider').value = 4;
        document.getElementById('budget-select').value = 4;
        document.getElementById('duration-slider').value = 90;
        updateDuration();
    });

    // Handle Hidden Gems Button
    document.querySelector('.btn-gems').addEventListener('click', function() {
        document.getElementById('widgets').style.display = 'none';
        document.getElementById('chart-path-view').style.display = 'block';
        
        // UI Updates for Hidden Gems
        document.getElementById('view-title').textContent = 'Hidden Gems';
        document.getElementById('view-description').style.display = 'block';
        document.getElementById('advanced-options-header').style.display = 'flex';
        document.getElementById('advanced-options-wrapper').style.display = 'none';
        document.querySelector('#advanced-options-header .arrow-icon').style.transform = 'rotate(0deg)';
        document.getElementById('advanced-options-header').setAttribute('aria-expanded', 'false');

        // Set Defaults for Hidden Gems
        document.querySelectorAll('.square-toggle').forEach(cb => cb.checked = false);
        ['historical', 'nature/park', 'cafes', 'desserts', 'art', 'museums'].forEach(cat => {
            const cb = document.querySelector(`.square-toggle[data-category="${cat}"]`);
            if (cb) cb.checked = true;
        });
        document.getElementById('popularity-slider').value = 1;
        document.getElementById('budget-select').value = 2;
        document.getElementById('duration-slider').value = 90;
        updateDuration();
    });

    // Handle Chart Your Own Path Button
    document.querySelector('.btn-path').addEventListener('click', function() {
        document.getElementById('widgets').style.display = 'none';
        document.getElementById('chart-path-view').style.display = 'block';

        // UI Updates for Custom Path
        document.getElementById('view-title').textContent = 'Customize';
        document.getElementById('view-description').style.display = 'none';
        document.getElementById('advanced-options-header').style.display = 'none';
        document.getElementById('advanced-options-wrapper').style.display = 'block';
    });

    // Handle Duration Slider
    const durationSlider = document.getElementById('duration-slider');
    const durationDisplay = document.getElementById('duration-display');
    
    function updateDuration() {
        const val = parseInt(durationSlider.value);
        const hours = Math.floor(val / 60);
        const minutes = val % 60;
        durationDisplay.textContent = (hours > 0 ? hours + ' hr ' : '') + minutes + ' min';
    }
    
    durationSlider.addEventListener('input', updateDuration);

    // Handle Back Button
    document.getElementById('btn-back').addEventListener('click', function() {
        document.getElementById('chart-path-view').style.display = 'none';
        document.getElementById('widgets').style.display = 'block';
    });

    // Handle Food & Dining Collapsible
    const foodHeader = document.getElementById('food-dining-header');
    const foodContent = document.getElementById('food-dining-content');
    const foodArrow = foodHeader.querySelector('.arrow-icon');

    function toggleFoodDining() {
        const isHidden = foodContent.style.display === 'none';
        foodContent.style.display = isHidden ? 'block' : 'none';
        foodArrow.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
        foodHeader.setAttribute('aria-expanded', isHidden);
    }

    foodHeader.addEventListener('click', toggleFoodDining);

    foodHeader.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleFoodDining();
        }
    });

    // Handle Advanced Options Collapsible
    const advHeader = document.getElementById('advanced-options-header');
    const advContent = document.getElementById('advanced-options-wrapper');
    const advArrow = advHeader.querySelector('.arrow-icon');

    function toggleAdvanced() {
        const isHidden = advContent.style.display === 'none';
        advContent.style.display = isHidden ? 'block' : 'none';
        advArrow.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
        advHeader.setAttribute('aria-expanded', isHidden);
    }

    advHeader.addEventListener('click', toggleAdvanced);
    advHeader.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleAdvanced(); }
    });

    // Handle Generate Route
    document.getElementById('btn-generate').addEventListener('click', function() {
        // Collect Categories
        const categories = [];
        document.querySelectorAll('.square-toggle:checked').forEach(cb => {
            if (cb.dataset.category) categories.push(cb.dataset.category);
        });

        // Map Data
        const center = map.getCenter();
        const bounds = map.getBounds();
        // Calculate radius in miles (approximate) based on distance to corner
        const radius = map.distance(center, bounds.getNorthEast()) / 1609.34;

        const payload = {
            categories: categories,
            longitude: center.lng,
            latitude: center.lat,
            radius: parseFloat(radius.toFixed(2)),
            driving: document.getElementById('transport-mode-toggle').checked,
            popularity: parseInt(document.getElementById('popularity-slider').value),
            budget: parseInt(document.getElementById('budget-select').value),
            datetime: document.getElementById('datetime-input').value ? new Date(document.getElementById('datetime-input').value).toISOString() : new Date().toISOString(),
            route_min: parseInt(document.getElementById('duration-slider').value)
        };

        // Call Dummy API
        fetch('http://127.0.0.1:8000/generate-quest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            console.log('Route generated:', data);
            // window.location.href = '/result'; // Forward to new page
        })
        .catch(err => console.error('Error:', err));
    });
</script>
</body>
</html>
