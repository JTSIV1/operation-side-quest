<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends - Operation Side-Quest</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: sans-serif;
            background-color: #2A3537;
            color: #e0e0e0;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        .sidebar {
            width: 33.33%;
            background-color: #2A3537;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #444;
            color: #ffffff;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .branding {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .branding img {
            height: 80px;
            width: auto;
        }
        .map-wrapper {
            width: 66.67%;
            height: 100%;
            position: relative;
        }
        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }
        /* Invert map tiles for night mode */
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        
        h2 { margin-top: 0; color: #e0e0e0; border-bottom: 1px solid #444; padding-bottom: 10px; }
        h3 { font-size: 1.1rem; margin-top: 25px; margin-bottom: 10px; color: #4CAF50; }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 2px solid #666;
            background-color: #3A4547;
            color: white;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #4CAF50; }
        
        button {
            padding: 10px 20px;
            background-color: rgba(76, 175, 80, 0.1);
            color: #e0e0e0;
            border: 2px solid #4CAF50;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover { background-color: rgba(76, 175, 80, 0.25); }
        
        .friend-card {
            background: #3A4547;
            border: 1px solid #666;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .friend-info { font-weight: bold; font-size: 1rem; }
        .friend-email { font-size: 0.85rem; color: #aaa; margin-top: 2px; }
        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
            margin-left: 10px;
        }
        .btn-danger {
            border-color: #f44336;
            background-color: rgba(244, 67, 54, 0.1);
            color: #e0e0e0;
        }
        .btn-danger:hover { background-color: rgba(244, 67, 54, 0.25); }

        .btn-back {
            background: none; border: none; color: #e0e0e0; font-size: 2rem; cursor: pointer; padding: 0; margin-right: 15px; line-height: 1;
        }
        .btn-back:hover { color: #fff; background: none; }
        .error { color: #cf6679; font-size: 0.9rem; margin-top: 5px; }
        .success { color: #4CAF50; font-size: 0.9rem; margin-top: 5px; }
        .empty-msg { color: #888; font-style: italic; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="branding">
                <button class="btn-back" onclick="window.location.href='/'" title="Back to Home">&larr;</button>
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="margin-right: 10px;">
                <img src="{{ url_for('static', filename='images/text.png') }}" alt="Operation Side-Quest" style="height: 40px; width: auto;">
            </div>
            
            <h2>Friends</h2>

            <div class="section">
                <h3>Add Friend</h3>
                <div class="input-group">
                    <input type="email" id="add-email" placeholder="Enter friend's email">
                    <button onclick="sendRequest()">Add</button>
                </div>
                <div id="add-message"></div>
            </div>

            <div class="section">
                <h3>Incoming Requests</h3>
                <div id="incoming-list">Loading...</div>
            </div>

            <div class="section">
                <h3>Pending Requests</h3>
                <div id="pending-list">Loading...</div>
            </div>

            <div class="section">
                <h3>My Friends</h3>
                <div id="friends-list">Loading...</div>
            </div>
        </div>
        <div class="map-wrapper">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map (Visual placeholder to match theme)
        const map = L.map('map').setView([40.4432, -79.9428], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const API_URL = "http://127.0.0.1:8000";
        const userId = localStorage.getItem('user_id');

        if (!userId) window.location.href = "/login";

        async function fetchData(endpoint, elementId, listType) {
            const container = document.getElementById(elementId);
            try {
                const res = await fetch(`${API_URL}${endpoint}`);
                const users = await res.json();
                
                container.innerHTML = '';
                if (!users || users.length === 0) {
                    container.innerHTML = '<div class="empty-msg">None</div>';
                    return;
                }

                users.forEach(u => {
                    const div = document.createElement('div');
                    div.className = 'friend-card';
                    let html = `
                        <div>
                            <div class="friend-info">${u.first_name} ${u.last_name} <span style="font-weight:normal; font-size:0.9em">(${u.username})</span></div>
                            <div class="friend-email">${u.email}</div>
                        </div>
                    `;
                    if (listType === 'incoming') {
                        html += `<div>
                            <button class="btn-small" onclick="acceptRequest('${u.email}')">Accept</button>
                            <button class="btn-small btn-danger" onclick="removeFriend('${u.id}')">Reject</button>
                        </div>`;
                    } else if (listType === 'pending') {
                        html += `<button class="btn-small btn-danger" onclick="removeFriend('${u.id}')">Cancel</button>`;
                    } else if (listType === 'friends') {
                        html += `<button class="btn-small btn-danger" onclick="removeFriend('${u.id}')">Remove</button>`;
                    }
                    div.innerHTML = html;
                    container.appendChild(div);
                });
            } catch (e) {
                console.error(e);
                container.innerHTML = '<div class="error">Error loading data</div>';
            }
        }

        async function sendRequest() {
            const emailInput = document.getElementById('add-email');
            const email = emailInput.value.trim();
            const msgDiv = document.getElementById('add-message');
            
            msgDiv.innerText = '';
            msgDiv.className = '';

            if (!email) return;

            try {
                const res = await fetch(`${API_URL}/add-friend`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, friend_email: email})
                });
                const data = await res.json();
                
                if (res.ok) {
                    msgDiv.innerText = "Request sent!";
                    msgDiv.className = 'success';
                    emailInput.value = '';
                    refreshAll();
                } else {
                    msgDiv.innerText = data.detail || "Error sending request";
                    msgDiv.className = 'error';
                }
            } catch (e) {
                msgDiv.innerText = "Connection error";
                msgDiv.className = 'error';
            }
        }

        async function acceptRequest(email) {
            try {
                const res = await fetch(`${API_URL}/add-friend`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, friend_email: email})
                });
                if (res.ok) {
                    // Refresh lists
                    refreshAll();
                } else {
                    alert("Failed to accept request");
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function removeFriend(friendId) {
            if (!confirm("Are you sure?")) return;
            try {
                const res = await fetch(`${API_URL}/remove-friend`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, friend_id: friendId})
                });
                if (res.ok) {
                    refreshAll();
                } else {
                    alert("Failed to remove");
                }
            } catch (e) {
                console.error(e);
            }
        }

        function refreshAll() {
            fetchData(`/friends/${userId}`, 'friends-list', 'friends');
            fetchData(`/friends/requests/incoming/${userId}`, 'incoming-list', 'incoming');
            fetchData(`/friends/requests/pending/${userId}`, 'pending-list', 'pending');
        }

        // Initial Load
        refreshAll();
    </script>
</body>
</html>
