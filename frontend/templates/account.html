<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Operation Side-Quest</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: sans-serif;
            background-color: #2A3537;
            color: #e0e0e0;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        .sidebar {
            width: 33.33%;
            background-color: #2A3537;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #444;
            color: #ffffff;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .branding {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .branding img {
            height: 80px;
            width: auto;
        }
        .btn-back {
            background: none; border: none; color: #e0e0e0; font-size: 2rem; cursor: pointer; padding: 0; margin-right: 15px; line-height: 1;
        }
        .btn-back:hover { color: #fff; }
        
        h2 { margin-top: 0; color: #e0e0e0; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; }

        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #aaa;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #666;
            background-color: #3A4547;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #4CAF50; }
        input:disabled {
            background-color: #2e3638;
            color: #888;
            border-color: #444;
            cursor: not-allowed;
        }

        .btn-save {
            width: 100%;
            padding: 15px;
            background-color: rgba(76, 175, 80, 0.1);
            color: #e0e0e0;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .btn-save:hover { background-color: rgba(76, 175, 80, 0.25); }

        .message { margin-top: 15px; text-align: center; font-weight: bold; min-height: 1.2em; }
        .success { color: #4CAF50; }
        .error { color: #f44336; }

        .map-wrapper {
            width: 66.67%;
            height: 100%;
            position: relative;
        }
        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="branding">
                <button class="btn-back" onclick="window.location.href='/'" title="Back to Home">&larr;</button>
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="margin-right: 10px;">
                <img src="{{ url_for('static', filename='images/text.png') }}" alt="Operation Side-Quest" style="height: 40px; width: auto;">
            </div>
            
            <h2>Account Settings</h2>

            <div class="form-group">
                <label>Email</label>
                <input type="text" id="email" disabled>
            </div>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="first_name">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="last_name">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="color: #888; font-style: italic; padding: 5px 0;">At this time you cannot change your password.</div>
            </div>

            <button class="btn-save" onclick="saveAccount()">Save Changes</button>
            <div id="message" class="message"></div>
        </div>
        <div class="map-wrapper">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map
        const map = L.map('map').setView([40.4432, -79.9428], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const API_URL = "http://127.0.0.1:8000";
        const userId = localStorage.getItem('user_id');
        if (!userId) window.location.href = "/login";

        async function loadUser() {
            try {
                const res = await fetch(`${API_URL}/user/${userId}`);
                const user = await res.json();
                if (res.ok) {
                    document.getElementById('email').value = user.email;
                    document.getElementById('first_name').value = user.first_name;
                    document.getElementById('last_name').value = user.last_name;
                    document.getElementById('username').value = user.username;
                } else {
                    alert("Failed to load user data.");
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function saveAccount() {
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = "Saving...";
            msgDiv.className = "message";

            const payload = {
                user_id: userId,
                username: document.getElementById('username').value,
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value
            };

            try {
                const res = await fetch(`${API_URL}/update-user`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (res.ok) {
                    msgDiv.innerText = "Changes saved successfully!";
                    msgDiv.className = "message success";
                } else {
                    msgDiv.innerText = data.detail || "Error saving changes.";
                    msgDiv.className = "message error";
                }
            } catch (e) {
                console.error(e);
                msgDiv.innerText = "Connection error.";
                msgDiv.className = "message error";
            }
        }

        loadUser();
    </script>
</body>
</html>
